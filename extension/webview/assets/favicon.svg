<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="textGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad2)"/>
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="4"/>

  <!-- Inner Plate -->
  <rect x="56" y="56" width="400" height="400" rx="40" fill="#ffffff" fill-opacity="0.03" stroke="#334155" stroke-width="2"/>

  <!-- Big MD Text -->
  <g filter="url(#glow2)">
    <!-- M -->
    <path d="M 120 310 V 160 L 176 236 L 232 160 V 310" 
          fill="none" 
          stroke="url(#textGrad2)" 
          stroke-width="32" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- D -->
    <path d="M 280 160 H 330 C 370 160 396 186 396 235 C 396 284 370 310 330 310 H 280 V 160 Z" 
          fill="none" 
          stroke="url(#textGrad2)" 
          stroke-width="32" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>

  <!-- Divider Line -->
  <line x1="120" y1="356" x2="392" y2="356" stroke="#475569" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Sub Text: PERFECT MD VIEWER -->
  <text x="256" y="396" 
        text-anchor="middle" 
        fill="#94a3b8" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="20" 
        font-weight="700" 
        letter-spacing="4">
    PERFECT MD VIEWER
  </text>
</svg>
